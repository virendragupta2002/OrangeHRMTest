environment: prod
baseUrl: https://opensource-demo.orangehrmlive.com
apiBaseUrl: https://opensource-demo.orangehrmlive.com/web/index.php/api/v2

credentials:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

timeouts:
  default: 60000
  navigation: 60000
  element: 30000
  api: 20000

retry:
  maxRetries: 3
  retryDelay: 3000

paths:
  login: /web/index.php/auth/login
  dashboard: /web/index.php/dashboard/index
  pim: /web/index.php/pim/viewEmployeeList
  addEmployee: /web/index.php/pim/addEmployee
  userManagement: /web/index.php/admin/viewSystemUsers

parallel:
  workers: 2
  fullyParallel: false

database:
  enabled: false
